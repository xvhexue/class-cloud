<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>破冰分组-优势词云组队</title>
<!-- 字节国内CDN，国内访问稳定 -->
<script src="https://lf3-cdn-tos.bytecdntp.com/cdn/expire-1-M/qrcodejs/1.0.0/qrcode.min.js"></script>
<script src="https://cdn.bootcdn.net/ajax/libs/supabase-js/2.33.1/supabase.min.js"></script>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:"Microsoft Yahei",sans-serif}
body{background:#6b28bc;color:#fff;height:100vh;overflow:hidden;display:flex}
.left-panel{width:220px;background:rgba(0,0,0,0.2);padding:24px;display:flex;flex-direction:column;gap:16px}
#qrcode{width:160px;height:160px;background:#fff;border-radius:12px;margin:0 auto;display:flex;align-items:center;justify-content:center;color:#333;font-size:12px}
.tip-text{text-align:center;font-size:14px;line-height:1.6}
.btn{border:none;border-radius:8px;padding:14px 8px;font-size:16px;cursor:pointer;width:100%}
.btn-yellow{background:#ffd32a;color:#000;font-weight:bold}
.btn-purple{background:#804fc2;color:#fff}
.right-area{flex:1;position:relative;padding:20px}
.form-page{position:absolute;top:0;left:0;width:100%;height:100%;background:#fff;color:#222;padding:30px;overflow:auto}
.form-title{font-size:24px;margin-bottom:20px;text-align:center;color:#6b28bc}
.form-item{margin:16px 0}
label{display:block;margin-bottom:6px;font-weight:bold}
input,select{width:100%;padding:10px;font-size:16px;border:1px solid #ccc;border-radius:6px}
#submitBtn{background:#6b28bc;color:#fff;border:none;padding:12px;border-radius:8px;font-size:16px;width:100%;margin-top:20px}
.tag-item{display:inline-block;background:rgba(255,255,255,0.2);border-radius:12px;padding:12px;margin:8px;text-align:center}
.tag-word{font-size:22px;font-weight:bold}
.tag-names{font-size:14px;margin-top:6px}
.cloud-word{font-size:16px;margin:12px;color:#fff;display:inline-block}
</style>
</head>
<body>
<div class="left-panel">
    <div id="qrcode">加载中...</div>
    <div class="tip-text">
扫描二维码<br/>
填写姓名+3个优势<br/>
收集完成后<br/>
老师点击【开始分析】切换组队视图
    </div>
    <button class="btn btn-yellow" id="switchView">✅ 开始分析（切换名字环绕图）</button>
    <button class="btn btn-purple" id="clearAll">🗑️ 清空全部数据</button>
</div>
<div class="right-area" id="wordCloud"></div>

<!-- 表单页面，扫码打开 -->
<div class="form-page" id="formPage" style="display:none">
    <h2 class="form-title">优势资源收集表</h2>
    <div class="form-item">
        <label>姓名</label>
        <input type="text" id="name" placeholder="请输入你的姓名">
    </div>
    <div class="form-item">
        <label>优势关键词1</label>
        <select id="k1">
            <option value="">请选择</option>
            <option value="口才好">口才好</option>
            <option value="剪辑">剪辑</option>
            <option value="拍摄">拍摄</option>
            <option value="文案">文案</option>
            <option value="运营">运营</option>
            <option value="销售">销售</option>
            <option value="耐心细心">耐心细心</option>
            <option value="擅长沟通">擅长沟通</option>
            <option value="懂产品">懂产品</option>
        </select>
    </div>
    <div class="form-item">
        <label>优势关键词2</label>
        <select id="k2">
            <option value="">请选择</option>
            <option value="口才好">口才好</option>
            <option value="剪辑">剪辑</option>
            <option value="拍摄">拍摄</option>
            <option value="文案">文案</option>
            <option value="运营">运营</option>
            <option value="销售">销售</option>
            <option value="耐心细心">耐心细心</option>
            <option value="擅长沟通">擅长沟通</option>
            <option value="懂产品">懂产品</option>
        </select>
    </div>
    <div class="form-item">
        <label>优势关键词3</label>
        <select id="k3">
            <option value="">请选择</option>
            <option value="口才好">口才好</option>
            <option value="剪辑">剪辑</option>
            <option value="拍摄">拍摄</option>
            <option value="文案">文案</option>
            <option value="运营">运营</option>
            <option value="销售">销售</option>
            <option value="耐心细心">耐心细心</option>
            <option value="擅长沟通">擅长沟通</option>
            <option value="懂产品">懂产品</option>
        </select>
    </div>
    <button id="submitBtn">提交我的优势</button>
</div>

<script>
const PAGE_URL = "https://xvhexue.github.io/class-cloud/"; 
const SUPABASE_URL = "https://unmtrrhuhsbshjhzsgpi.supabase.co";
const SUPABASE_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InVubXRycmh1aHNic2hqenNncGkiLCJyIjoiYW5vbiIsImlhdCI6MTc1ODA0MjE4OCwiZXhwIjoyMDczNjE4MTg4fQ.ZO4k8Q5nT8Nn9nF5nN0nT8Nn9nF5nN0nT8Nn9nF5nN0nT8Nn9nF5nN0";
const supabase = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
let viewMode = "cloud";

// 优化设备判断：宽度小于768px判定手机表单
const isMobile = window.innerWidth <= 768;
if(isMobile){
    document.querySelector(".left-panel").style.display="none";
    document.querySelector("#wordCloud").style.display="none";
    document.getElementById("formPage").style.display="block";
}else{
    //大屏：生成二维码
    setTimeout(()=>{
        new QRCode(document.getElementById("qrcode"), {
            text: PAGE_URL,
            width:160,
            height:160
        });
    },300)
}

//提交表单
document.getElementById("submitBtn").onclick = async ()=>{
    const name = document.getElementById("name").value.trim();
    const k1 = document.getElementById("k1").value;
    const k2 = document.getElementById("k2").value;
    const k3 = document.getElementById("k3").value;
    if(!name || !k1 || !k2 || !k3){
        alert("姓名和3个优势都要填！");return;
    }
    await supabase.from("students").insert([{name,kw1:k1,kw2:k2,kw3:k3}]);
    alert("提交成功！回到大屏查看词云");
}

//切换视图
document.getElementById("switchView").onclick = ()=>{
    viewMode = viewMode==="cloud"?"force":"cloud";
    render();
}
//清空
document.getElementById("clearAll").onclick = async ()=>{
    if(confirm("确定清空全部学员数据？")){
        await supabase.from("students").delete().neq("id",0);
        render();
    }
}

//实时监听数据库更新
supabase.channel("students")
.on("postgres_changes", {event:"*",schema:"public",table:"students"},()=>render())
.subscribe();

async function render(){
    const {data} = await supabase.from("students").select("*");
    const box = document.getElementById("wordCloud");
    box.innerHTML = "";
    const map = {};
    data.forEach(item=>{
        [item.kw1,item.kw2,item.kw3].forEach(k=>{
            if(!map[k]) map[k]=[];
            map[k].push(item.name);
        })
    })
    if(viewMode==="cloud"){
        //词云模式
        Object.keys(map).forEach(word=>{
            const span = document.createElement("span");
            span.className="cloud-word";
            span.style.fontSize = `${16 + map[word].length*8}px`;
            span.innerText = word;
            box.appendChild(span);
        })
    }else{
        //标签+名单模式
        Object.keys(map).forEach(word=>{
            const div = document.createElement("div");
            div.className="tag-item";
            div.innerHTML = `<div class="tag-word">${word}</div><div class="tag-names">${map[word].join("、")}</div>`
            box.appendChild(div);
        })
    }
}
render();
</script>
</body>
</html>
